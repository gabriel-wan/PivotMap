[project]
name = "pivotmap"
version = "0.1.0"
description = "AI-powered career proof-mapping tool built on the MiroFlow agent framework."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Backend / API (mirrors requirements.txt so the uv env can run the full app)
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.55",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
    # Agent-graph skeleton (issue #1)
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# MiroFlow ("run-agent") is a heavy, CLI-oriented framework. It is pulled in as
# an extra so `uv sync` stays fast and the `trace` smoke test never depends on a
# large external resolution. Install with: uv sync --extra miroflow
miroflow = [
    "run-agent @ git+https://github.com/MiroMindAI/MiroFlow",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.uv]
# PivotMap is a flat application (top-level packages imported via PYTHONPATH),
# not an installable library, so uv should not try to build it as a wheel.
package = false
